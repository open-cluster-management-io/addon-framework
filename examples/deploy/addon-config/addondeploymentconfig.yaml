apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnDeploymentConfig
metadata:
  name: deploy-config
spec:
  nodePlacement:
    # nodeSelector is a hard constraint and affinity a preference; when both are set the
    # scheduler applies both. The agent must run on Linux, prefers an infrastructure node, and
    # falls back to any other Linux node on clusters that have none (single-node or compact).
    nodeSelector:
      "kubernetes.io/os": "linux"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/infra
              operator: Exists
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/infra
      operator: Exists
